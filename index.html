
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Screen Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  min-height: 100vh;
}

header { padding: 25px 15px; }

h1 { color: #62e6ae; }

.container {
  width: 92%;
  max-width: 650px;
  margin: 15px auto;
  padding: 25px;
  background: #1c293b;
  border-radius: 16px;
}

button, input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border-radius: 9px;
  border: none;
  font-size: 16px;
}

button {
  background: #25c58a;
  color: #071b16;
  font-weight: bold;
  cursor: pointer;
}

.secondary {
  background: #34445b;
  color: white;
}

.hidden { display: none !important; }

.status {
  color: #62e6ae;
  min-height: 24px;
  overflow-wrap: anywhere;
}

#room {
  font-size: 32px;
  letter-spacing: 5px;
  color: #62e6ae;
  font-weight: bold;
  padding: 15px;
}

video {
  width: 100%;
  background: black;
  border-radius: 10px;
  margin-top: 12px;
}

</style>
</head>

<body>

<header>
<h1>Universal Screen Connect</h1>
<p>Wireless screen sharing for Windows and Mac</p>
</header>

<div class="container" id="home">
<h2>Choose your device</h2>

<button onclick="showReceiver()">TV Receiver</button>
<button onclick="showSender()">Computer Sender</button>

<p class="status" id="homeStatus">Ready</p>
</div>

<div class="container hidden" id="receiver">

<h2>TV Receiver</h2>

<p>Your room code is:</p>

<div id="room">TEST1234</div>

<p>Enter this code on your computer.</p>

<p class="status" id="receiverStatus">
Receiver screen opened!
</p>

<button onclick="startReceiver()">
Test Server Connection
</button>

<video id="remoteVideo" autoplay playsinline controls></video>

<button class="secondary" onclick="toggleFullscreen()">
Fullscreen
</button>

<button class="secondary" onclick="disconnect()">
Disconnect
</button>

</div>

<div class="container hidden" id="sender">

<h2>Computer Sender</h2>

<p>Enter the room code displayed on your TV.</p>

<input id="roomInput" maxlength="8" placeholder="8-character room code">

<button onclick="startSender()">
Connect and Share Screen
</button>

<video id="localVideo" autoplay muted playsinline></video>

<button class="secondary" onclick="disconnect()">
Disconnect
</button>

<p class="status" id="senderStatus"></p>

</div>

<script>

// ==================================
// SUPABASE CONFIGURATION
// ==================================

var SUPABASE_URL =
"https://luihrwntwtyleeqlwqtv.supabase.co";

var SUPABASE_KEY =
"sb_publishable_jkkKbQ3KIVowW5yYiG5dNQ_JyFFilaR";

var supabaseClient = null;

if (window.supabase &&
    typeof window.supabase.createClient === "function") {
  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
}

// ==================================
// GLOBAL VARIABLES
// ==================================

var channel = null;
var peer = null;
var localStream = null;
var remoteCandidates = [];
var currentRole = null;

// ==================================
// HELPERS
// ==================================

function setStatus(message) {
  document.getElementById("homeStatus").textContent = message;
  document.getElementById("receiverStatus").textContent = message;
  document.getElementById("senderStatus").textContent = message;
}

// ==================================
// INTERFACE
// ==================================

function showReceiver() {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("sender").classList.add("hidden");
  document.getElementById("receiver").classList.remove("hidden");

  currentRole = "receiver";

  document.getElementById("room").textContent = "TEST1234";

  document.getElementById("receiverStatus").textContent =
    "Receiver screen opened!";
}

function showSender() {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("receiver").classList.add("hidden");
  document.getElementById("sender").classList.remove("hidden");

  currentRole = "sender";
}

// ==================================
// SUPABASE CONNECTION TEST
// ==================================

async function createChannel(code, role) {

  if (!supabaseClient) {
    throw new Error("Supabase library did not load.");
  }

  if (channel) {
    await supabaseClient.removeChannel(channel);
    channel = null;
  }

  channel = supabaseClient.channel("usc-" + code, {
    config: {
      broadcast: {
        self: false,
        ack: true
      }
    }
  });

  channel.on(
    "broadcast",
    { event: "signal" },
    function(message) {
      if (!message.payload) return;
      if (message.payload.from === role) return;

      handleSignal(message.payload).catch(function(error) {
        setStatus("Signal error: " + error.message);
      });
    }
  );

  await new Promise(function(resolve, reject) {

    channel.subscribe(function(status, error) {

      if (status === "SUBSCRIBED") {
        resolve();
      }

      if (status === "CHANNEL_ERROR" ||
          status === "TIMED_OUT") {
        reject(error || new Error(status));
      }

    });

  });
}

// ==================================
// RECEIVER SERVER TEST
// ==================================

async function startReceiver() {

  try {

    currentRole = "receiver";

    document.getElementById("receiverStatus").textContent =
      "Testing Supabase connection...";

    await createChannel("TEST1234", "receiver");

    document.getElementById("receiverStatus").textContent =
      "SUPABASE CONNECTED!";

  } catch (error) {

    document.getElementById("receiverStatus").textContent =
      "ERROR: " + error.message;

    console.log(error);

  }

}

// ==================================
// SIGNALING
// ==================================

async function sendSignal(data) {

  if (!channel) {
    throw new Error("No active connection.");
  }

  var result = await channel.send({
    type: "broadcast",
    event: "signal",
    payload: {
      type: data.type,
      offer: data.offer,
      answer: data.answer,
      candidate: data.candidate,
      from: currentRole
    }
  });

  if (result !== "ok") {
    throw new Error("Signal could not be sent.");
  }

}

// ==================================
// WEBRTC
// ==================================

function createPeer() {

  peer = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" }
    ]
  });

  peer.onicecandidate = function(event) {

    if (event.candidate) {
      sendSignal({
        type: "candidate",
        candidate: event.candidate.toJSON()
      }).catch(console.log);
    }

  };

  peer.ontrack = function(event) {

    document.getElementById("remoteVideo").srcObject =
      event.streams[0];

    document.getElementById("receiverStatus").textContent =
      "Screen received!";

  };

  peer.onconnectionstatechange = function() {

    document.getElementById("receiverStatus").textContent =
      "Connection: " + peer.connectionState;

  };

  return peer;
}

// ==================================
// SIGNAL HANDLER
// ==================================

async function handleSignal(data) {

  if (data.type === "offer" && currentRole === "receiver") {

    if (peer) peer.close();

    remoteCandidates = [];

    createPeer();

    await peer.setRemoteDescription(data.offer);

    var answer = await peer.createAnswer();

    await peer.setLocalDescription(answer);

    await sendSignal({
      type: "answer",
      answer: peer.localDescription
    });

  }

  else if (data.type === "answer" && currentRole === "sender") {

    if (!peer) return;

    await peer.setRemoteDescription(data.answer);

  }

  else if (data.type === "candidate" && peer) {

    if (peer.remoteDescription) {
      await peer.addIceCandidate(data.candidate);
    } else {
      remoteCandidates.push(data.candidate);
    }

  }

}

// ==================================
// COMPUTER SENDER
// ==================================

async function startSender() {

  try {

    var code = document.getElementById("roomInput")
      .value.trim().toUpperCase();

    if (!/^[A-Z0-9]{8}$/.test(code)) {
      throw new Error("Enter a valid 8-character code.");
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia) {
      throw new Error("Screen sharing is not supported.");
    }

    setStatus("Choose your screen...");

    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: false
    });

    document.getElementById("localVideo").srcObject =
      localStream;

    currentRole = "sender";

    await createChannel(code, "sender");

    createPeer();

    localStream.getTracks().forEach(function(track) {
      peer.addTrack(track, localStream);
    });

    var offer = await peer.createOffer();

    await peer.setLocalDescription(offer);

    await sendSignal({
      type: "offer",
      offer: peer.localDescription
    });

    setStatus("Waiting for TV...");

  } catch (error) {

    setStatus("ERROR: " + error.message);
    console.log(error);

  }

}

// ==================================
// DISCONNECT
// ==================================

async function disconnect() {

  if (localStream) {
    localStream.getTracks().forEach(function(track) {
      track.stop();
    });
    localStream = null;
  }

  if (peer) {
    peer.close();
    peer = null;
  }

  if (channel && supabaseClient) {
    var oldChannel = channel;
    channel = null;
    await supabaseClient.removeChannel(oldChannel);
  }

  remoteCandidates = [];

  document.getElementById("remoteVideo").srcObject = null;
  document.getElementById("localVideo").srcObject = null;

  document.getElementById("receiver").classList.add("hidden");
  document.getElementById("sender").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");

  setStatus("Disconnected.");

}

// ==================================
// FULLSCREEN
// ==================================

function toggleFullscreen() {

  var video = document.getElementById("remoteVideo");

  if (video.requestFullscreen) {
    video.requestFullscreen();
  } else if (video.webkitEnterFullscreen) {
    video.webkitEnterFullscreen();
  }

}

console.log("Universal Screen Connect loaded.");

</script>

</body>
</html>
